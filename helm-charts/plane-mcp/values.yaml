replicaCount: 1

image:
  repository: makeplane/plane-mcp-server
  pullPolicy: IfNotPresent
  digest: ""
  tag: v0.2.8

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

command: []
args: []

service:
  type: ClusterIP
  port: 8211

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: plane-mcp.example.com
      paths:
        - path: /http/api-key/mcp
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  PLANE_BASE_URL: "https://api.plane.so"
  PLANE_INTERNAL_BASE_URL: ""
  PLANE_OAUTH_PROVIDER_BASE_URL: "https://plane-mcp.example.com"
  PLANE_OAUTH_PROVIDER_CLIENT_ID: "disabled"
  PLANE_OAUTH_PROVIDER_CLIENT_SECRET: "disabled"

extraEnv: []

extraEnvFrom: []

livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
