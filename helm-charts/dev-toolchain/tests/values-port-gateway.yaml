global:
  imageRegistry: ""

toolchains:
  birch:
    enabled: true
    image: example.invalid/dev-toolchain:test
    network:
      mode: nodePort
    devTools:
      autoInstall: false
    ports:
      ssh:
        containerPort: 22
        nodePort: 32022
      extra: []
    storage:
      pvc:
        enabled: false
      hostPath:
        enabled: false
      volumes: {}
      sharedPVC:
        enabled: false
    proxy:
      enabled: false
    portGateway:
      enabled: true
      image: example.invalid/nginx:1.29-alpine
      hostSuffix: birch.iprtapp.com
      listenPort: 18080
      allowedPortRanges:
        - start: 3000
          end: 4000
        - start: 8000
          end: 9000
      ingress:
        className: nginx
        clusterIssuer: letsencrypt-prd
        tlsSecretName: tls-cert-birch-iprtapp-com
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
    resources: {}
    env: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
