apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kanbn.fullname" . }}
  labels:
    {{- include "kanbn.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kanbn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kanbn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kanbn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h {{ include "kanbn.postgresql.fullname" . | quote }} -p {{ .Values.postgresql.port }} -U {{ .Values.postgresql.username | quote }} -d {{ .Values.postgresql.database | quote }}; do
                sleep 2
              done
        - name: migrate
          image: "{{ include "kanbn.migrateImage" . }}"
          imagePullPolicy: {{ .Values.migrateImage.pullPolicy }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kanbn.secretName" . }}
                  key: {{ .Values.secret.postgresPasswordKey }}
            - name: POSTGRES_URL
              value: {{ include "kanbn.postgresUrl" . | quote }}
      containers:
        - name: kan
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ include "kanbn.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kanbn.secretName" . }}
                  key: {{ .Values.secret.postgresPasswordKey }}
            - name: POSTGRES_URL
              value: {{ include "kanbn.postgresUrl" . | quote }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kanbn.secretName" . }}
                  key: {{ .Values.secret.betterAuthSecretKey }}
            {{- range $k, $v := .Values.env }}
            {{- if and (kindIs "map" $v) (hasKey $v "secretName") (hasKey $v "secretKey") }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $v.secretName }}
                  key: {{ $v.secretKey }}
            {{- else }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
