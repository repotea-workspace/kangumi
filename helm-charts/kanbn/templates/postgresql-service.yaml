{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kanbn.postgresql.fullname" . }}
  labels:
    {{- include "kanbn.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgresql.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "kanbn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
