services:
  dev-toolchain:
    image: dev-toolchain:test
    container_name: dev-toolchain-test-compose
    hostname: dev-toolchain-test
    privileged: true
    ports:
      - "2222:22"
    volumes:
      - dev-data:/data
      - dev-code:/code
      - docker-data:/var/lib/docker
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  dev-data:
    driver: local
  dev-code:
    driver: local
  docker-data:
    driver: local
