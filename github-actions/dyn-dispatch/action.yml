name: Finalize failed dynamic dispatch
description: Close a source-owned pending dispatch when its Trigger terminates unsuccessfully.
inputs:
  token:
    description: The source repository GITHUB_TOKEN with statuses write permission.
    required: true
  trigger-workflow:
    description: Trusted source Trigger workflow path.
    required: true
  status-policy:
    description: Set to empty for automatic reporting without an aggregate status.
    required: false
    default: checks-v1
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOURCE_STATUS_TOKEN: ${{ inputs.token }}
        STATUS_POLICY: ${{ inputs.status-policy }}
        TRIGGER_WORKFLOW: ${{ inputs.trigger-workflow }}
      run: python3 "$GITHUB_ACTION_PATH/main.py"
