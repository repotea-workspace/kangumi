name: 'Trigger Dynamic Actions'
description: 'Trigger dynamic actions to run you CI'
inputs:
  dot_github:
    description: 'The path for .github'
    required: false
    default: '.github'
  git_email:
    description: 'Git email'
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'
  git_name:
    description: 'Git name'
    required: false
    default: 'github-actions[bot]'
  ssh_key:
    description: 'SSH private key'
    required: true
  owner:
    description: 'dynamic actions repo owner'
    required: false
    default: '0xfe10'
  status_policy:
    description: Optional explicit aggregate policy (for example checks-v1); automatic per-workflow reporting is enabled without it.
    required: false
    default: ''
  status_token:
    description: Source repository GITHUB_TOKEN with statuses write; enables automatic pending/dispatch status lifecycle and is required when status_policy is set.
    required: false
  metadata-format:
    description: Forwarded metadata format. Keep legacy until every consumer supports source-yml.
    required: false
    default: legacy
runs:
  using: "composite"
  steps:
    - name: Expose tag name
      shell: bash
      run: |
        if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
          echo "GIT_TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "GIT_TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
        fi
    - name: Expose short SHA
      shell: bash
      run: echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
    - name: Extract branch name
      shell: bash
      run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      id: extract_branch
    - uses: kielabokkie/ssh-key-and-known-hosts-action@ff80dac93ba2346f20dbc7f331286c400f0109f7
      with:
        ssh-private-key: ${{ inputs.ssh_key }}
        ssh-host: github.com
    - name: Trigger dynamic actions
      id: forward
      shell: bash
      env:
        INPUT_DOT_GITHUB: ${{ inputs.dot_github }}
        INPUT_GIT_EMAIL: ${{ inputs.git_email }}
        INPUT_GIT_NAME: ${{ inputs.git_name }}
        EXECUTION_OWNER: ${{ inputs.owner }}
        REPO_BRANCH: ${{ steps.extract_branch.outputs.branch }}
        STATUS_POLICY: ${{ inputs.status_policy }}
        SOURCE_STATUS_TOKEN: ${{ inputs.status_token }}
        METADATA_FORMAT: ${{ inputs['metadata-format'] }}
      run: |
        set -euo pipefail


        # repository is the full github repo path, e.g. prtmax/endfather
        REPOSITORY="${GITHUB_REPOSITORY}"
        # project_name is just the repo name, e.g. endfather (used for git tag)
        PROJECT_NAME="${GITHUB_REPOSITORY#*/}"

        T_BRANCH="${GITHUB_REPOSITORY}"

        git clone "git@github.com:${EXECUTION_OWNER}/dynamic-actions.git"
        cd dynamic-actions
        git fetch origin
        git checkout -B "$T_BRANCH" "origin/$T_BRANCH" || git checkout -b "$T_BRANCH"

        # prepare changes

        rm -rf .github
        mkdir -p .github

        # only copy dyn-workflows as workflows, ignore other directories like instructions
        if [ -d "../$INPUT_DOT_GITHUB/dyn-workflows" ]; then
          cp -R "../$INPUT_DOT_GITHUB/dyn-workflows" .github/workflows
        else
          echo "not found dyn-workflows dir: ../$INPUT_DOT_GITHUB/dyn-workflows"
          exit 1
        fi

        REPO_TAG="${GIT_TAG_NAME:-}"
        COMMIT_SHA="${SHA:-$GITHUB_SHA}"
        DYN_FORWARD_COMMIT_FILE="${RUNNER_TEMP}/dyn-forward-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
        export REPOSITORY REPO_BRANCH REPO_TAG COMMIT_SHA T_BRANCH DYN_FORWARD_COMMIT_FILE

        # Read event values as data, never interpolate commit messages into shell.
        # Legacy remains the default until every consumer has migrated.
        python3 - <<'PY'
        from datetime import datetime, timezone
        import json
        import os
        from pathlib import Path

        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        head = event.get("head_commit") or {}
        message = head.get("message") or "Dynamic workflow dispatch"
        Path(os.environ["DYN_FORWARD_COMMIT_FILE"]).write_text(
            f'[{os.environ["T_BRANCH"]}]: {message}', encoding="utf-8"
        )
        if os.environ["METADATA_FORMAT"] == "legacy":
            metadata = Path(".github")
            (metadata / "date.txt").write_text(
                datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z") + "\n",
                encoding="utf-8",
            )
            ref_name = os.environ["REPO_TAG"] or os.environ["REPO_BRANCH"]
            (metadata / "ref.txt").write_text(ref_name + "\n", encoding="utf-8")
            ref_file = "tag.txt" if os.environ["REPO_TAG"] else "branch.txt"
            (metadata / ref_file).write_text(ref_name + "\n", encoding="utf-8")
            (metadata / "message.txt").write_text(message, encoding="utf-8")
            authors = sorted({
                commit.get("author", {}).get("username")
                for commit in event.get("commits", [])
                if commit.get("author", {}).get("username")
            })
            if not authors:
                authors = [head.get("author", {}).get("username") or os.environ["GITHUB_ACTOR"]]
            (metadata / "author.txt").write_text(
                "".join("@" + name + "\n" for name in authors), encoding="utf-8"
            )
            (metadata / "commit.txt").write_text(os.environ["COMMIT_SHA"] + "\n", encoding="utf-8")
            (metadata / "repository.txt").write_text(
                os.environ["REPOSITORY"] + "\n", encoding="utf-8"
            )
        elif os.environ["METADATA_FORMAT"] != "source-yml":
            raise ValueError("metadata-format must be legacy or source-yml")
        PY

        if [ -n "$STATUS_POLICY" ] || [ -n "$SOURCE_STATUS_TOKEN" ]; then
          # The receipt survives a failed push; the source observer also covers
          # a forcibly cancelled Trigger where this EXIT trap cannot run.
          trap 'result=$?; if [ "$result" -ne 0 ]; then python3 "$GITHUB_ACTION_PATH/forward.py" fail || true; fi' EXIT
        fi
        python3 "$GITHUB_ACTION_PATH/forward.py" prepare

        # push
        git config user.name "${INPUT_GIT_NAME}"
        git config user.email "${INPUT_GIT_EMAIL}"

        git status
        git add .

        git commit -F "${DYN_FORWARD_COMMIT_FILE}"

        if ! git push origin "$T_BRANCH"; then
          echo "Branch push failed; rebasing onto latest origin/$T_BRANCH and retrying."
          git fetch origin "+refs/heads/$T_BRANCH:refs/remotes/origin/$T_BRANCH"
          git rebase -X theirs "origin/$T_BRANCH"
          git push origin "$T_BRANCH"
        fi

        if [ -z "${REPO_TAG}" ]; then
          python3 "$GITHUB_ACTION_PATH/forward.py" finish --execution-sha "$(git rev-parse HEAD)"

          echo "This is pushed a branch (${REPO_BRANCH}). completed to push Github Actions."
          exit 0
        fi

        TAG_NAME=${REPO_TAG}-${PROJECT_NAME}
        git tag -d "${TAG_NAME}" || true
        git push origin ":${TAG_NAME}" || true

        git tag "${TAG_NAME}"
        git push origin "${TAG_NAME}"

        python3 "$GITHUB_ACTION_PATH/forward.py" finish --execution-sha "$(git rev-parse HEAD)"
    - name: Publish source-owned dispatch receipt
      if: inputs.status_policy == ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dyn-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.forward.outputs.receipt }}
        if-no-files-found: error
        retention-days: 7
    - name: Close automatic statuses after receipt failure
      if: failure() && inputs.status_policy == '' && inputs.status_token != ''
      shell: bash
      env:
        SOURCE_STATUS_TOKEN: ${{ inputs.status_token }}
      run: |
        if [ -f dynamic-actions/.github/source.yml ] || [ -f dynamic-actions/.github/source.json ]; then
          python3 "$GITHUB_ACTION_PATH/forward.py" fail --metadata-dir dynamic-actions/.github
        fi
