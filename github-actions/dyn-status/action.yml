name: Report dynamic CI status
description: Route trusted credentials and reconcile one dynamic execution.
inputs:
  mode:
    description: Route an execution, notify its source, or report inside the source repository.
    required: false
    default: report
  config:
    description: Trusted YAML config checked out from the execution repository default branch; legacy JSON remains readable.
    required: false
  execution-repository:
    description: Fixed trusted execution repository; required only in source mode.
    required: false
  source:
    description: Legacy explicit source key in trusted config.
    required: false
  credential-group:
    description: Credential group selected by route mode from trusted source owners.
    required: false
  execution-token:
    description: Execution repository token with actions and contents read.
    required: true
  source-token:
    description: Source GITHUB_TOKEN in source mode; central token needs Actions write for enrolled callbacks, or statuses write for legacy reporting.
    required: false
outputs:
  matched:
    description: Whether the execution source belongs to a configured credential group.
    value: ${{ steps.run.outputs.matched }}
  group:
    description: Trusted credential group key.
    value: ${{ steps.run.outputs.group }}
  secret_name:
    description: Secret name from trusted default-branch configuration, never from forwarded metadata.
    value: ${{ steps.run.outputs.secret_name }}
  execution_sha:
    description: Immutable execution SHA selected by the event or manual input.
    value: ${{ steps.run.outputs.execution_sha }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        STATUS_MODE: ${{ inputs.mode }}
        STATUS_CONFIG: ${{ inputs.config }}
        EXECUTION_REPOSITORY: ${{ inputs.execution-repository }}
        SOURCE_KEY: ${{ inputs.source }}
        CREDENTIAL_GROUP: ${{ inputs.credential-group }}
        EXECUTION_READ_TOKEN: ${{ inputs.execution-token }}
        SOURCE_STATUS_TOKEN: ${{ inputs.source-token }}
      run: python3 "$GITHUB_ACTION_PATH/main.py"
