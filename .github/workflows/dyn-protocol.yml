name: Dynamic CI protocol tests
on:
  push:
    paths:
      - 'github-actions/dyn-*/**'
      - 'github-actions/clone-dyn/**'
      - 'github-actions/gitops-deploy/**'
      - '.github/workflows/dyn-protocol.yml'
  pull_request:
    paths:
      - 'github-actions/dyn-*/**'
      - 'github-actions/clone-dyn/**'
      - 'github-actions/gitops-deploy/**'
      - '.github/workflows/dyn-protocol.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test dynamic protocol
        run: |
          python3 -m unittest discover -s github-actions/dyn-common -v
          python3 -m unittest discover -s github-actions/dyn-source -v
          python3 -m unittest discover -s github-actions/gitops-deploy -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
  metadata-platforms:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test source metadata and public outputs
        run: |
          python -m unittest discover -s github-actions/dyn-common -p test_source_metadata.py -v
          python -m unittest discover -s github-actions/dyn-source -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
