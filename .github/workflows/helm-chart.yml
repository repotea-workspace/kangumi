name: Release helm chart

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-helm-chart:
    name: Release helm chart
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - package: any-cors-helm
            path: helm-charts/any-cors
          - package: dev-toolchain-helm
            path: helm-charts/dev-toolchain
          - package: any-tunnel-helm
            path: helm-charts/any-tunnel
          - package: lanhu-mcp-helm
            path: helm-charts/lanhu-mcp
          - package: graphiti-helm
            path: helm-charts/graphiti
          - package: obsidian-fns-helm
            path: helm-charts/obsidian-fns
          - package: opendesign-helm
            path: helm-charts/opendesign
          - package: kanbn-helm
            path: helm-charts/kanbn
          - package: plane-mcp-helm
            path: helm-charts/plane-mcp
          - package: plane-enterprise-helm
            path: helm-charts/plane-enterprise/.generated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare Plane Enterprise Chart
        if: matrix.package == 'plane-enterprise-helm'
        run: ./scripts/prepare-plane-enterprise-chart.sh

      - name: Get Chart Version
        id: chart_version
        run: |
          version=$(yq eval '.version' ${{ matrix.path }}/Chart.yaml)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Chart | Push
        uses: appany/helm-oci-chart-releaser@d94988c92bed2e09c6113981f15f8bb495d10943
        with:
          name: ${{ matrix.package }}
          repository: ${{ github.repository }}
          tag: ${{ steps.chart_version.outputs.version }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: "0xfe10"
          registry_password: ${{ github.token }}
          update_dependencies: "true" # Defaults to false
